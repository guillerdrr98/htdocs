<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Galería de emojis</title>
  </head>
  <body>
    <h1>Sube tu emoji</h1>

    <form action="upload.php" method="POST" enctype="multipart/form-data">
      <label for="emoji"
        >Elige tu emoji (png, jpg, gif o webp, máx. 200 KB):</label
      ><br /><br />
      <input type="file" name="emoji[]" id="emoji" multiple /><br /><br />

      <button type="submit">Subir emoji</button>
    </form>
  </body>
</html>
